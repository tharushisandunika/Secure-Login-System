<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SecureAuth — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --panel: #11111a;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #f0eeff;
    --muted: #8880aa;
    --success: #34d399;
    --error: #f87171;
    --input-bg: rgba(255,255,255,0.04);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background blobs */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
  }
  .bg-blob.b1 { width: 500px; height: 500px; background: #6c63ff; top: -150px; left: -100px; animation-delay: 0s; }
  .bg-blob.b2 { width: 400px; height: 400px; background: #a78bfa; bottom: -100px; right: -100px; animation-delay: -3s; }
  .bg-blob.b3 { width: 300px; height: 300px; background: #34d399; top: 40%; left: 50%; animation-delay: -5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  .grid-overlay {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 44px;
    backdrop-filter: blur(20px);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(30px);
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
  }

  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .logo-text span { color: var(--accent2); }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .input-wrap {
    position: relative;
  }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--muted);
    pointer-events: none;
    transition: color 0.2s;
  }

  input {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px 13px 42px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    background: rgba(108,99,255,0.06);
    box-shadow: 0 0 0 4px rgba(108,99,255,0.12);
  }

  input:focus + .input-icon, .input-wrap:focus-within .input-icon {
    color: var(--accent2);
  }

  .toggle-pass {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: color 0.2s;
  }

  .toggle-pass:hover { color: var(--accent2); }

  .remember-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    margin-top: -4px;
  }

  .remember-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    text-transform: none;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0;
    margin: 0;
  }

  input[type="checkbox"] {
    width: 16px; height: 16px;
    border-radius: 4px;
    accent-color: var(--accent);
    cursor: pointer;
    padding: 0;
  }

  .forgot { font-size: 13px; color: var(--accent2); text-decoration: none; transition: opacity 0.2s; }
  .forgot:hover { opacity: 0.7; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(108,99,255,0.3);
    position: relative;
    overflow: hidden;
  }

  .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 32px rgba(108,99,255,0.4); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-primary .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    color: var(--muted);
    font-size: 12px;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .footer-text {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    margin-top: 24px;
  }

  .footer-text a { color: var(--accent2); text-decoration: none; font-weight: 500; }
  .footer-text a:hover { text-decoration: underline; }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 20px;
    display: none;
    align-items: center;
    gap: 10px;
  }

  .alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
  .alert.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--success); }
  .alert.show { display: flex; }

  .security-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 20px;
  }

  .security-badge::before {
    content: '🔒';
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>
<div class="grid-overlay"></div>

<div class="card">
  <div class="logo-area">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">Secure<span>Auth</span></div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to your secure account. Your data is protected with military-grade encryption.</p>

  <div class="alert error" id="errorAlert">
    <span>⚠️</span>
    <span id="errorMsg">Invalid credentials. Please try again.</span>
  </div>

  <div class="field">
    <label>Username</label>
    <div class="input-wrap">
      <span class="input-icon">👤</span>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
    </div>
  </div>

  <div class="field">
    <label>Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔑</span>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
      <button class="toggle-pass" onclick="togglePass()" type="button" id="passToggle">👁️</button>
    </div>
  </div>

  <div class="field" id="mfaField" style="display: none;">
    <label>Authenticator OTP Code</label>
    <div class="input-wrap">
      <span class="input-icon">🛡️</span>
      <input type="text" id="totpCode" placeholder="Enter 6-digit code" maxlength="6" autocomplete="one-time-code"/>
    </div>
  </div>

  <div class="remember-row">
    <label>
      <input type="checkbox" id="remember"/> Remember me
    </label>
    <a href="#" class="forgot">Forgot password?</a>
  </div>

  <button class="btn-primary" onclick="login()" id="loginBtn">
    <span id="btnText">Sign In</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="footer-text">
    Don't have an account? <a href="register.html">Create one free</a>
  </div>

  <div class="security-badge">256-bit SSL Encrypted · JWT Secured · XSS Protected</div>
</div>

<script>
  let mfaRequired = false;

  function togglePass() {
    const p = document.getElementById('password');
    const btn = document.getElementById('passToggle');
    if (p.type === 'password') { p.type = 'text'; btn.textContent = '🙈'; }
    else { p.type = 'password'; btn.textContent = '👁️'; }
  }

  function showError(msg, isInfo = false) {
    const el = document.getElementById('errorAlert');
    document.getElementById('errorMsg').textContent = msg;
    el.classList.add('show');
    
    if (isInfo) {
      el.classList.remove('error');
      el.style.background = 'rgba(108,99,255,0.1)';
      el.style.borderColor = 'rgba(108,99,255,0.2)';
      el.style.color = 'var(--accent2)';
    } else {
      el.style.background = '';
      el.style.borderColor = '';
      el.style.color = '';
      el.classList.add('error');
    }
  }

  function setLoading(on) {
    document.getElementById('loginBtn').disabled = on;
    document.getElementById('btnText').style.display = on ? 'none' : 'block';
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
  }

  async function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const totpCode = document.getElementById('totpCode').value.trim();
    document.getElementById('errorAlert').classList.remove('show');

    if (!username || !password) { showError('Please fill in all fields.'); return; }
    if (mfaRequired && !totpCode) { showError('Please enter your MFA Authenticator code.'); return; }

    setLoading(true);
    try {
      const payload = { username, password };
      if (mfaRequired) {
        payload.totpCode = totpCode;
      }

      const res = await fetch('http://localhost:8080/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok && data.success) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        window.location.href = 'dashboard.html';
      } else if (data.mfaRequired) {
        mfaRequired = true;
        document.getElementById('mfaField').style.display = 'block';
        document.getElementById('totpCode').focus();
        document.getElementById('btnText').textContent = 'Verify & Sign In';
        showError('Multi-Factor Authentication required. Enter the 6-digit code from Google Authenticator.', true);
      } else {
        showError(data.message || 'Login failed. Please try again.');
      }
    } catch (err) {
      showError('Cannot connect to server. Make sure Spring Boot is running.');
    }
    setLoading(false);
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
