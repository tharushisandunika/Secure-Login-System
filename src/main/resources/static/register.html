<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SecureAuth — Create Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --panel: #11111a;
    --border: rgba(255,255,255,0.07);
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #f0eeff;
    --muted: #8880aa;
    --success: #34d399;
    --error: #f87171;
    --input-bg: rgba(255,255,255,0.04);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; padding: 24px; }
  .bg-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15; pointer-events: none; animation: float 8s ease-in-out infinite; }
  .bg-blob.b1 { width: 500px; height: 500px; background: #a78bfa; top: -150px; right: -100px; }
  .bg-blob.b2 { width: 400px; height: 400px; background: #34d399; bottom: -100px; left: -100px; animation-delay: -3s; }
  @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-20px) scale(1.05)} }
  .grid-overlay { position: fixed; inset: 0; background-image: linear-gradient(rgba(167,139,250,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(167,139,250,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
  .card { position: relative; width: 460px; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 44px; animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; transform: translateY(30px); }
  @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
  .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
  .logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); }
  .logo-text span { color: var(--accent2); }
  h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 6px; letter-spacing: -0.5px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
  .input-wrap { position: relative; }
  .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--muted); pointer-events: none; }
  input { width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px 13px 42px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.2s, background 0.2s, box-shadow 0.2s; }
  input:focus { border-color: var(--accent); background: rgba(108,99,255,0.06); box-shadow: 0 0 0 4px rgba(108,99,255,0.12); }

  /* Password strength meter */
  .strength-bar { display: flex; gap: 4px; margin-top: 8px; }
  .strength-seg { flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 3px; transition: background 0.3s; }
  .strength-label { font-size: 11px; color: var(--muted); margin-top: 5px; }

  /* Requirements checklist */
  .req-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 8px; }
  .req { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; transition: color 0.2s; }
  .req.met { color: var(--success); }
  .req-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .btn-primary { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: 12px; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s; box-shadow: 0 4px 24px rgba(108,99,255,0.3); margin-top: 8px; }
  .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-primary .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; align-items: center; gap: 10px; }
  .alert.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
  .alert.success { background: rgba(52,211,153,0.1); border: 1px solid rgba(52,211,153,0.2); color: var(--success); }
  .alert.show { display: flex; }
  .footer-text { text-align: center; font-size: 14px; color: var(--muted); margin-top: 20px; }
  .footer-text a { color: var(--accent2); text-decoration: none; font-weight: 500; }
  .footer-text a:hover { text-decoration: underline; }
  .security-badge { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 16px; }
  .toggle-pass { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .toggle-pass:hover { color: var(--accent2); }
</style>
</head>
<body>
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="grid-overlay"></div>

<div class="card">
  <div class="logo-area">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">Secure<span>Auth</span></div>
  </div>

  <h1>Create your account</h1>
  <p class="subtitle">Join thousands of users who trust SecureAuth for their digital security.</p>

  <div class="alert error" id="errorAlert"><span>⚠️</span><span id="errorMsg"></span></div>
  <div class="alert success" id="successAlert"><span>✅</span><span id="successMsg"></span></div>

  <div class="field">
    <label>Username</label>
    <div class="input-wrap">
      <span class="input-icon">👤</span>
      <input type="text" id="username" placeholder="Choose a username" autocomplete="username" oninput="validateForm()"/>
    </div>
  </div>

  <div class="field">
    <label>Email address</label>
    <div class="input-wrap">
      <span class="input-icon">📧</span>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email" oninput="validateForm()"/>
    </div>
  </div>

  <div class="field">
    <label>Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔑</span>
      <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" oninput="checkStrength()"/>
      <button class="toggle-pass" onclick="togglePass('password','pt1')" type="button" id="pt1">👁️</button>
    </div>
    <div class="strength-bar" id="strengthBar">
      <div class="strength-seg" id="s1"></div>
      <div class="strength-seg" id="s2"></div>
      <div class="strength-seg" id="s3"></div>
      <div class="strength-seg" id="s4"></div>
    </div>
    <div class="strength-label" id="strengthLabel">Enter a password</div>
    <div class="req-list">
      <div class="req" id="r-len"><div class="req-dot"></div>8+ characters</div>
      <div class="req" id="r-upper"><div class="req-dot"></div>Uppercase letter</div>
      <div class="req" id="r-lower"><div class="req-dot"></div>Lowercase letter</div>
      <div class="req" id="r-num"><div class="req-dot"></div>Number</div>
    </div>
  </div>

  <div class="field">
    <label>Confirm password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" oninput="validateForm()"/>
      <button class="toggle-pass" onclick="togglePass('confirm','pt2')" type="button" id="pt2">👁️</button>
    </div>
  </div>

  <button class="btn-primary" onclick="register()" id="regBtn">
    <span id="btnText">Create Account</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="footer-text">Already have an account? <a href="login.html">Sign in</a></div>
  <div class="security-badge">🔒 Passwords are bcrypt hashed · Never stored in plain text</div>
</div>

<script>
  function togglePass(id, btnId) {
    const p = document.getElementById(id);
    const b = document.getElementById(btnId);
    if (p.type === 'password') { p.type = 'text'; b.textContent = '🙈'; }
    else { p.type = 'password'; b.textContent = '👁️'; }
  }

  function checkStrength() {
    const p = document.getElementById('password').value;
    const segs = ['s1','s2','s3','s4'];
    const colors = ['#f87171','#fb923c','#facc15','#34d399'];
    const labels = ['Too weak','Weak','Good','Strong 💪'];
    let score = 0;
    if (p.length >= 8) score++;
    if (/[A-Z]/.test(p)) score++;
    if (/[a-z]/.test(p)) score++;
    if (/[0-9]/.test(p)) score++;
    segs.forEach((id, i) => {
      document.getElementById(id).style.background = i < score ? colors[score-1] : 'rgba(255,255,255,0.08)';
    });
    document.getElementById('strengthLabel').textContent = p.length ? labels[score-1] || 'Too weak' : 'Enter a password';
    document.getElementById('r-len').classList.toggle('met', p.length >= 8);
    document.getElementById('r-upper').classList.toggle('met', /[A-Z]/.test(p));
    document.getElementById('r-lower').classList.toggle('met', /[a-z]/.test(p));
    document.getElementById('r-num').classList.toggle('met', /[0-9]/.test(p));
    validateForm();
  }

  function validateForm() {
    const u = document.getElementById('username').value.trim();
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('password').value;
    const c = document.getElementById('confirm').value;
    const valid = u && e && p.length >= 8 && p === c && /[A-Z]/.test(p) && /[a-z]/.test(p) && /[0-9]/.test(p);
    document.getElementById('regBtn').disabled = !valid;
  }

  function showMsg(type, msg) {
    document.getElementById('errorAlert').classList.remove('show');
    document.getElementById('successAlert').classList.remove('show');
    if (type === 'error') { document.getElementById('errorMsg').textContent = msg; document.getElementById('errorAlert').classList.add('show'); }
    else { document.getElementById('successMsg').textContent = msg; document.getElementById('successAlert').classList.add('show'); }
  }

  function setLoading(on) {
    document.getElementById('regBtn').disabled = on;
    document.getElementById('btnText').style.display = on ? 'none' : 'block';
    document.getElementById('spinner').style.display = on ? 'block' : 'none';
  }

  async function register() {
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    setLoading(true);
    try {
      const res = await fetch('http://localhost:8080/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (data.success) {
        showMsg('success', 'Account created! Redirecting to login...');
        setTimeout(() => window.location.href = 'login.html', 2000);
      } else {
        showMsg('error', data.message || 'Registration failed.');
      }
    } catch (err) {
      showMsg('error', 'Cannot connect to server. Make sure Spring Boot is running.');
    }
    setLoading(false);
  }
</script>
</body>
</html>
